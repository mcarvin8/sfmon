[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sfmon"
dynamic = ["version"]
description = "Monitor a Salesforce org and expose Prometheus metrics from a long-running Python service."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Matt Carvin", email = "matthewjcarvin@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Monitoring",
]
# Lower bounds are tested in CI (unit-tests.yml "minimum" job); upper bounds
# stop the next major release from breaking a fresh install. The OTel
# exporter-prometheus and instrumentation packages are pre-1.0 betas
# released in lockstep with opentelemetry-sdk (0.51b0 pairs with 1.30).
dependencies = [
    "simple_salesforce>=1.12,<2",
    "prometheus_client>=0.20,<1",
    "requests>=2.28,<3",
    "apscheduler>=3.10,<4",
    "pandas>=2.2.2,<4",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-prometheus>=0.51b0,<1",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-logging>=0.51b0,<1",
]

[project.optional-dependencies]
aws = ["boto3>=1.28,<2"]

[project.urls]
Homepage = "https://github.com/mcarvin8/sfmon"
Documentation = "https://github.com/mcarvin8/sfmon/tree/main/docs"
Issues = "https://github.com/mcarvin8/sfmon/issues"

[project.scripts]
sfmon = "sfmon.salesforce_monitoring:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { file = ["version.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/sfmon"]
omit = ["tests/*", "src/sfmon/salesforce_monitoring.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
