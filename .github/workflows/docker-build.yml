name: Docker Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: sfmon:ci-test

      - name: Verify image starts and dependencies resolve
        run: docker run --rm --entrypoint python3 sfmon:ci-test -c "import sfmon.salesforce_monitoring; print('Import OK')"
