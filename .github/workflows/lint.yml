name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.3"
          args: check

      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.3"
          args: format --check
